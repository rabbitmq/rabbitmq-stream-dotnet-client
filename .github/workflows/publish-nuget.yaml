name: Publish RabbitMQ Stream Client to NuGet

on:
  workflow_call:

permissions:
  contents: read

jobs:
  publish:
    name: Publish NuGet Package
    runs-on: ubuntu-latest
    environment: nuget-release

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet restore \
            RabbitMQ.Stream.Client/RabbitMQ.Stream.Client.csproj

      - name: Pack
        run: |
          dotnet pack -p:GeneratePackageOnBuild=false \
            RabbitMQ.Stream.Client/RabbitMQ.Stream.Client.csproj \
            --configuration Release \
            --no-restore \
            --output packages

      - name: Verify package
        shell: bash
        run: |
          ls -lah packages/
          test -n "$(find packages -maxdepth 1 \
            -name 'RabbitMQ.Stream.Client.*.nupkg' \
            -print -quit)"

      - name: NuGet Trusted Publishing login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: gsantomaggio

      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        shell: bash
        run: |
          shopt -s nullglob
          packages=(packages/RabbitMQ.Stream.Client.*.nupkg)

          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json
          done
